function timeAgo(d){
  const diff = Date.now() - new Date(d).getTime();
  const m = Math.floor(diff/60000);
  if(m<1) return 'baru saja';
  if(m<60) return m+'m lalu';
  const h = Math.floor(m/60); if(h<24) return h+'j lalu';
  const day = Math.floor(h/24); return day+'h lalu';
}

function toast(msg, kind='default'){
  const wrap = document.getElementById('toastWrap');
  const colors = { default:'bg-ink-800 text-white', success:'bg-mint-500 text-white', error:'bg-coral-600 text-white' };
  const el = document.createElement('div');
  el.className = `toast-enter px-4 py-3 rounded-2xl shadow-lift text-sm font-medium ${colors[kind]||colors.default}`;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 3200);
}

/* ---------------------------- STORAGE LAYER ---------------------------- */
/* ------------------------------------------------------------------
 * Dual-mode capability layer.
 * Inside Claude.ai, `window.claude` exists and we use the built-in
 * db/sample capabilities exactly as before (UNCHANGED behavior).
 * Deployed standalone (own domain / Capacitor Android / Capacitor
 * iOS), `window.claude` does not exist, so we fall back to REST
 * calls against the bundled server/server.js — same method shapes
 * (collection().doc().get/set/delete, doc().acquire(), sample.json),
 * so none of the ~3000 lines of app logic below need to change.
 * ------------------------------------------------------------------ */
function makeRestDb(){
  async function j(url, opts){ const r = await fetch(url, opts); if(!r.ok) throw new Error('db request failed: '+url); return r.json(); }
  function docRef(path){
    const [col, id] = path.split('/');
    return {
      get: async () => { const d = await j(`/api/db/${col}/${id}`); return { exists: d.exists, data: () => d.data }; },
      set: async (data) => j(`/api/db/${col}/${id}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) }),
      delete: async () => j(`/api/db/${col}/${id}`, { method:'DELETE' }),
      acquire: async (opts) => j(`/api/db/${col}/${id}/acquire`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(opts||{}) }),
    };
  }
  return {
    doc: (path) => docRef(path),
    collection: (name) => ({
      get: async () => { const d = await j(`/api/db/${name}`); return { docs: d.docs.map(x=>({ id:x.id, data: () => x.data })) }; },
      doc: (id) => docRef(`${name}/${id}`),
    }),
  };
}
function makeRestAi(){
  const apiBase = ['localhost','127.0.0.1'].includes(location.hostname) ? '' : 'https://screenly-rkj3.onrender.com';
  async function request(body){
    const r = await fetch(apiBase+'/api/ai', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const data = await r.json().catch(()=>({}));
    if(!r.ok){
      const detail = data.detail ? `: ${data.detail}` : '';
      throw new Error((data.error||`AI request failed (${r.status})`)+detail);
    }
    return data;
  }
  async function call(prompt, opts){
    const data = await request({ prompt, modelTier: opts?.modelTier });
    return { text: data.text };
  }
  call.json = async function(prompt, opts){
    const data = await request({ prompt, modelTier: opts?.modelTier, json:true });
    return data.json;
  };
  return call;
}
async function initCapabilities(){
  if(typeof window.claude !== 'undefined' && window.claude){
    // Running inside a Claude.ai artifact — unchanged original behavior.
    try{ dbApi = await claude.use('db'); dbAvailable = !!dbApi; }catch(e){ dbApi=null; dbAvailable=false; }
    try{ sampleApi = await claude.use('sample'); aiAvailable = !!sampleApi; }catch(e){ sampleApi=null; aiAvailable=false; }
  } else {
    // Standalone deployment (own domain, Android, iOS) — talk to server/server.js.
    try{ dbApi = makeRestDb(); await dbApi.doc('meta/__ping').get(); dbAvailable = true; }catch(e){ console.warn('Standalone DB not reachable — is server/server.js running?', e); dbApi=null; dbAvailable=false; }
    try{ sampleApi = makeRestAi(); aiAvailable = true; }catch(e){ sampleApi=null; aiAvailable=false; }
  }
}
async function colGet(col){
  if(dbAvailable){
    try{
      const snap = await dbApi.collection(col).get();
      const out = {};
      snap.docs.forEach(d=> out[d.id] = d.data());
      MEM[col] = out;
      return out;
    }catch(e){ console.warn('db get failed', col, e); return MEM[col]||{}; }
  }
  return MEM[col]||{};
}
async function docSet(col, id, data){
  MEM[col] = MEM[col]||{}; MEM[col][id] = data;
  if(dbAvailable){
    try{ await dbApi.collection(col).doc(id).set(data); }catch(e){ console.warn('db set failed', col, id, e); }
  }
}
async function docDelete(col, id){
  if(MEM[col]) delete MEM[col][id];
  if(dbAvailable){
    try{ await dbApi.collection(col).doc(id).delete(); }catch(e){ console.warn('db delete failed', col, id, e); }
  }
}
async function refreshAll(){
  await Promise.all(['jobs','candidates','chatTemplates','interviewTemplates','notifications','talentLeads','sourcingGuides','dailyLogs','tasks'].map(colGet));
  if(dbAvailable){
    try{
      const s = await dbApi.doc('settings/company').get();
      if(s.exists) MEM.settings = s.data();
    }catch(e){}
  }
}

/* ------------------------------ SEED DATA ------------------------------ */
async function seedIfNeeded(){
  await ensureAccount();
  let doc = { exists:false };
  if(dbAvailable){
    try{ doc = await dbApi.doc('meta/seed').get(); }catch(e){ doc = { exists:false }; }
  } else {
    doc = { exists: MEM.__seedVersion === SEED_VERSION, data:()=>({version:MEM.__seedVersion}) };
  }
  if(doc.exists && doc.data() && doc.data().version === SEED_VERSION){ await refreshAll(); await ensureNonDestructiveUpgrades(); return; }

  if(!dbAvailable){
    await wipeAndSeed();
    MEM.__seedVersion = SEED_VERSION;
    await ensureNonDestructiveUpgrades();
    return;
  }

  // Use a short lease so multiple simultaneously-opened tabs never seed/duplicate at once.
  const holder = 'tab_' + Math.random().toString(36).slice(2) + Date.now();
  let lease = { acquired:false };
  try{ lease = await dbApi.doc('meta/seed').acquire({ holder, ttlMs: 25000 }); }catch(e){ lease = { acquired:false }; }

  if(lease.acquired){
    try{ doc = await dbApi.doc('meta/seed').get(); }catch(e){}
    if(doc.exists && doc.data() && doc.data().version === SEED_VERSION){ await refreshAll(); await ensureNonDestructiveUpgrades(); return; }
    await wipeAndSeed();
    try{ await dbApi.doc('meta/seed').set({ seeded:true, version:SEED_VERSION, at:Date.now() }); }catch(e){}
    await refreshAll();
    await ensureNonDestructiveUpgrades();
  } else {
    // Another tab/session is seeding right now — wait briefly, then just load whatever it produced.
    await new Promise(r=>setTimeout(r, 2000));
    await refreshAll();
    await ensureNonDestructiveUpgrades();
  }
}

// Adds new fields/collections introduced by later app updates WITHOUT ever wiping
// existing jobs, candidates, or any other real recruitment data.
async function ensureNonDestructiveUpgrades(){
  let upgraded = false;
  if(dbAvailable){
    try{ const d = await dbApi.doc('meta/upgradeV1').get(); upgraded = d.exists; }catch(e){}
  } else {
    upgraded = !!MEM.__upgradeV1;
  }
  if(upgraded){ await ensureNonDestructiveUpgradesV2(); return; }

  // 1) Backfill the qualification builder fields on existing jobs (additive only).
  for(const j of jobsArr()){
    if(j.mustHave && j.goodToHave && j.bonus && j.redFlags) continue;
    const patched = {
      ...j,
      mustHave: j.mustHave || (j.requiredSkills||[]).slice(),
      goodToHave: j.goodToHave || (j.preferredSkills||[]).slice(),
      bonus: j.bonus || [],
      redFlags: j.redFlags || ['Tidak bisa bekerja dengan target', 'Komunikasi kurang baik', 'Tidak berdomisili di lokasi kerja'],
    };
    await docSet('jobs', j.id, patched);
  }

  // 2) Seed sourcing guides if none exist yet.
  if(!Object.keys(MEM.sourcingGuides||{}).length){
    const guides = [
      { id:uid('sg'), category:'Live Host',

async function ensureNonDestructiveUpgradesV4(){
  let done = false;
  if(dbAvailable){ try{ done = (await dbApi.doc('meta/upgradeV4').get()).exists; }catch(e){} }
  else { done = !!MEM.__upgradeV4; }
  if(done) return;
  for(const c of candArr()){
    const currentName = c.displayName || c.name;
    if(isUsableCandidateName(currentName)) continue;
    const extractedName = isUsableCandidateName(c.cvData?.fullName) ? c.cvData.fullName : extractCandidateNameFromText(c.cvText||'');

    await docSet('candidates', c.id, { ...c, name:extractedName, displayName:extractedName, nameSource:'cv', nameConfidence:'fallback', lastActivityAt:Date.now() });
  }
  if(dbAvailable){ try{ await dbApi.doc('meta/upgradeV4').set({done:true, at:Date.now()}); }catch(e){} }
  else { MEM.__upgradeV4 = true; }
}

async function wipeCollection(col){

  MEM[col] = {};

const CANDIDATE_NAME_PLACEHOLDERS = new Set(['kandidat','candidate','kandidat tanpa nama','unknown','nama kandidat']);
function isUsableCandidateName(name){
  const value = String(name||'').replace(/\s+/g,' ').trim();
  return value.length >= 2 && value.length < 100 && !CANDIDATE_NAME_PLACEHOLDERS.has(value.toLowerCase()) && !/^candidate\s*\d+$/i.test(value);
}
function normaliseCandidateName(name){
  const value = String(name||'').replace(/[|,;]+/g,' ').replace(/\s+/g,' ').trim();
  return isUsableCandidateName(value) && /^[\p{L}][\p{L}'-]*(?:\s+[\p{L}][\p{L}'-]*){1,5}$/u.test(value) ? value : '';
}
function extractCandidateNameFromText(text){
  const source = String(text||'').replace(/\r/g,'\n');
  const labelled = source.match(/(?:nama\s*(?:lengkap|kandidat)?|full\s*name)\s*[:\-]\s*([\p{L}][\p{L}'-]*(?:\s+[\p{L}][\p{L}'-]*){1,5})/iu);
  const labelledName = normaliseCandidateName(labelled?.[1]?.split(/\s+(?:email|e-mail|telepon|phone|alamat|address|tanggal|date)\b/i)[0]);
  if(labelledName) return labelledName;
  const lines = source.split('\n').map(line=>line.replace(/\s+/g,' ').trim()).filter(Boolean);
  for(const line of lines.slice(0,12)){
    const candidate = normaliseCandidateName(line.replace(/(?:email|e-mail|telepon|phone|alamat|address).*$/i,''));
    if(candidate && !/resume|curriculum vitae|profile|profil|cv\b/i.test(candidate)) return candidate;
  }
  const compact = source.replace(/\s+/g,' ').trim();
  const beforeContact = compact.split(/\s+(?:email|e-mail|telepon|phone|alamat|address)\s*[:\-]?/i)[0];
  const tail = beforeContact.split(/[|,;•]/).pop()?.trim();
  return normaliseCandidateName(tail);
}
function candidateDisplayName(c){
  return isUsableCandidateName(c?.displayName) ? c.displayName : isUsableCandidateName(c?.name) ? c.name : 'Nama belum tersedia';
}
function candidateActivityAt(c){
  return c?.lastActivityAt || (c?.timeline||[]).reduce((max,e)=>Math.max(max,e.date||0), c?.appliedAt||0);
}
function latestAssessmentStatus(c){
  if(c?.insight) return 'Candidate Insight siap';
  if(c?.interview?.analysis) return 'Interview dianalisis';
  if(c?.testCam) return 'Test Cam dinilai';
  if(c?.screening) return 'CV dianalisis';
  return 'Assessment belum dimulai';
}

// Fallback berbasis kata kunci, dipakai saat kapabilitas `sample` tidak tersedia.
function fallbackExtractCV(text){
  const emailMatch = text.match(/[\w.+-]+@[\w-]+\.[\w.-]+/);
  const phoneMatch = text.match(/(\+?\d[\d \-]{7,}\d)/);
  const extractedName = extractCandidateNameFromText(text);
  const skillsDict = ['sourcing','screening','rekrut','sales','negosiasi','komunikasi','excel','office','crm','sql','marketing','desain','customer service','leadership','javascript','python','accounting','admin','data entry','media sosial','konten','make up','styling','koreografi','tari','mc','obs','tiktok'];
  const lower = text.toLowerCase();
  const skills = skillsDict.filter(s=>lower.includes(s));
  const yearsMatch = text.match(/(\d{1,2})\s*\+?\s*tahun/i) || text.match(/(\d{1,2})\s*\+?\s*years?/i);
  return {
    fullName: extractedName || null,
    email: emailMatch ? emailMatch[0] : null, phone: phoneMatch ? phoneMatch[0] : null, location: null,
    education: [], experience: [], skills, certifications: [], languages: [],
    totalYearsExperience: yearsMatch ? parseInt(yearsMatch[1]) : null
  };
}
function fallbackScore(cvData, job){
  const reqSkills = (job.requiredSkills||[]).map(s=>s.toLowerCase());
  const mustHave = (job.mustHave||[]).map(s=>s.toLowerCase());
  const redFlags = (job.redFlags||[]).map(s=>s.toLowerCase());
  const candSkills = (cvData.skills||[]).map(s=>s.toLowerCase());
  const cvBlob = JSON.stringify(cvData).toLowerCase();
  const matched = reqSkills.filter(s=>candSkills.some(cs=>cs.includes(s)||s.includes(cs)));
  const mustMatched = mustHave.filter(s=>cvBlob.includes(s));
  const skillsScore = reqSkills.length ? Math.round((matched.length/reqSkills.length)*100) : 60;
  const expScore = cvData.totalYearsExperience!=null ? Math.min(100, Math.round((cvData.totalYearsExperience/(job.minExperience||1||1))*70+20)) : 50;
  const eduScore = cvData.education && cvData.education.length ? 80 : 50;
  const overall = Math.round(skillsScore*0.4 + expScore*0.35 + eduScore*0.25);
  const concerns = [];
  if(reqSkills.length && matched.length<reqSkills.length) concerns.push('Beberapa skill yang dibutuhkan tidak ditemukan secara jelas di teks CV.');
  if(mustHave.length && mustMatched.length<mustHave.length) concerns.push('Beberapa kriteria "must have" belum terlihat jelas di CV — perlu diverifikasi saat interview.');
  const evidenceBlob = JSON.stringify(cvData).toLowerCase();
  const professionalDance = /(dance|dancer|tari|penari|koreografi|choreograph|panggung|stage performance|kompetisi tari|dance competition)/i.test(evidenceBlob) && !/hobi|hobby|suka menari|likes dancing/i.test(evidenceBlob);
  const evidence = [];
  if(professionalDance) evidence.push('CV memuat bukti terkait tari/performance yang perlu ditinjau recruiter.');
  if(/live|streaming|tiktok|host|audience|penonton/i.test(evidenceBlob)) evidence.push('CV memuat pengalaman yang berkaitan dengan live, streaming, host, atau audiens.');
  const missingInfo = [];
  if(!cvData.totalYearsExperience) missingInfo.push('Lama pengalaman kerja tidak bisa dipastikan dari CV.');
  if(!professionalDance) missingInfo.push('Bukti pengalaman tari profesional belum ditemukan di CV.');
  return { overallScore: overall, breakdown:{ experience:expScore, skills:skillsScore, education:eduScore, relevantBackground:Math.round((skillsScore+expScore)/2), jobRequirements:skillsScore },
    whyMatches: `Berdasarkan pencocokan kata kunci, skill yang tercantum pada kandidat ini cocok dengan ${matched.length} dari ${reqSkills.length} skill yang dibutuhkan untuk posisi ini.`,
    cvEvidence:evidence, strengths:matched.length?['Skill yang relevan tercantum di CV.']:[], relevantExperience:cvData.experience||[], cvGaps:missingInfo,
    recommendedInterviewQuestions:['Pengalaman mana yang paling relevan dengan posisi ini?','Bukti kerja atau performa apa yang dapat ditunjukkan?'], concerns, missingInfo };
}

function fallbackTalentMatch(talent, job){
  const text = `${talent.name} ${talent.category||''} ${talent.experience||''} ${(talent.skills||[]).join(' ')} ${talent.notes||''}`.toLowerCase();
  const req = (job.mustHave&&job.mustHave.length?job.mustHave:job.requiredSkills||[]).map(s=>s.toLowerCase());
  const matched = req.filter(s=>text.includes(s));
  const score = req.length ? Math.round((matched.length/req.length)*100) : 55;
  return { overallScore: score,
    whyMatches: matched.length ? `Ditemukan kecocokan kata kunci untuk: ${matched.join(', ')}.` : 'Belum banyak kecocokan kata kunci yang ditemukan secara otomatis — perlu ditinjau manual.',
    needsVerification: req.length && matched.length<req.length ? ['Beberapa kriteria belum bisa dipastikan dari catatan yang ada, perlu diverifikasi langsung.'] : [] };
}

/* ------------------------------ PDF PARSING ----------------------------- */
let pdfjsLoaded = false;
async function ensurePdfJs(){
  if(pdfjsLoaded) return true;
  try{
    await new Promise((res,rej)=>{
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload = res; s.onerror = rej; document.head.appendChild(s);
    });
    window['pdfjsLib'].GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    pdfjsLoaded = true; return true;
  }catch(e){ console.warn('pdf.js load failed', e); return false; }
}
async function extractTextFromPdf(arrayBuffer){
  const ok = await ensurePdfJs();
  if(!ok) throw new Error('pdfjs_unavailable');
  const pdf = await window['pdfjsLib'].getDocument({data:arrayBuffer}).promise;
  let text = '';
  for(let i=1;i<=Math.min(pdf.numPages,15);i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it=>it.str).join(' ') + '\n';
  }
  return text;
}
let mammothLoaded = false;
async function ensureMammoth(){
  if(mammothLoaded) return true;
  try{
    await new Promise((res,rej)=>{
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';
      s.onload = res; s.onerror = rej; document.head.appendChild(s);
    });
    mammothLoaded = true; return true;
  }catch(e){ return false; }
}
async function extractTextFromDocx(arrayBuffer){
  const ok = await ensureMammoth();
  if(!ok) throw new Error('mammoth_unavailable');
  const result = await window['mammoth'].extractRawText({arrayBuffer});
  return result.value;
}

function talentSourcingSummary(){
  const leads = talentArr();
  const today = todayStr();
  const weekAgo = Date.now()-7*86400000;
  const todayLeads = leads.filter(t=>new Date(t.createdAt).toISOString().slice(0,10)===today).length;
  const weekLeads = leads.filter(t=>t.createdAt>=weekAgo).length;
  const bySource = {}; const byCity = {}; const byCategory = {};
  leads.forEach(t=>{ bySource[t.source||'Lainnya']=(bySource[t.source||'Lainnya']||0)+1; byCity[t.location||'Lainnya']=(byCity[t.location||'Lainnya']||0)+1; byCategory[t.category||'Lainnya']=(byCategory[t.category||'Lainnya']||0)+1; });
  const topSource = Object.entries(bySource).sort((a,b)=>b[1]-a[1])[0];
  const topCity = Object.entries(byCity).sort((a,b)=>b[1]-a[1])[0];
  return `<div class="grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="card rounded-3xl p-4 text-center"><p class="font-display font-extrabold text-xl">${todayLeads}</p><p class="text-[11px] text-muted font-semibold">Leads Hari Ini</p></div>
    <div class="card rounded-3xl p-4 text-center"><p class="font-display font-extrabold text-xl">${weekLeads}</p><p class="text-[11px] text-muted font-semibold">Leads Minggu Ini</p></div>
    <div class="card rounded-3xl p-4 text-center"><p class="font-display font-bold text-sm truncate">${topSource?esc(topSource[0]):'—'}</p><p class="text-[11px] text-muted font-semibold">Sumber Teratas${topSource?' ('+topSource[1]+')':''}</p></div>
    <div class="card rounded-3xl p-4 text-center"><p class="font-display font-bold text-sm truncate">${topCity?esc(topCity[0]):'—'}</p><p class="text-[11px] text-muted font-semibold">Kota Teratas${topCity?' ('+topCity[1]+')':''}</p></div>
  </div>`;
}
function weeklyChart(cands){
  const weeks = 6; const buckets = new Array(weeks).fill(0);
  cands.forEach(c=>{ const wk = Math.floor((Date.now()-c.appliedAt)/(7*86400000)); if(wk>=0 && wk<weeks) buckets[weeks-1-wk]++; });
  const max = Math.max(1,...buckets);
  const colors = ['bg-coral-300','bg-coral-400','bg-coral-400','bg-coral-500','bg-coral-500','bg-coral-600'];
  return `<div class="flex items-end gap-3 md:gap-5 h-40">
    ${buckets.map((v,i)=>`<div class="flex-1 flex flex-col items-center gap-2">
      <div class="w-full flex items-end justify-center h-32"><div class="w-full max-w-[36px] rounded-t-xl ${colors[i]} transition-all" style="height:${(v/max)*100}%; min-height:4px"></div></div>
      <span class="text-[10px] text-muted font-semibold">M${i+1}</span>
    </div>`).join('')}
  </div>`;
}

        ${PIPELINE_STAGES.map(s=>`<option value="${s}" ${candFilters.stage===s?'selected':''}>${stageLabel(s)}</option>`).join('')}

    </div>
  </div>
  <div id="candList" class="space-y-3">

  </div>`;
}
function renderPartial(){
  const el = document.getElementById('candList');
  if(!el) return;
  let list = candArr();
  if(candFilters.q){ const q=candFilters.q.toLowerCase(); list = list.filter(c=>{ const job=getJob(c.jobId);
    return candidateDisplayName(c).toLowerCase().includes(q) || (c.email||'').toLowerCase().includes(q) || (job?.name||'').toLowerCase().includes(q) || (c.cvData?.skills||[]).some(s=>s.toLowerCase().includes(q)) || c.stage.toLowerCase().includes(q); }); }
  if(candFilters.jobId) list = list.filter(c=>c.jobId===candFilters.jobId);
  if(candFilters.stage) list = list.filter(c=>c.stage===candFilters.stage);
  if(candFilters.minScore) list = list.filter(c=>(c.screening?.overallScore||0)>=candFilters.minScore);
  el.innerHTML = list.length? list.map(c=>candidateRow(c)).join('') : emptyState('Tidak ada kandidat yang cocok dengan filter.', 'Coba ubah pencarian atau filter.');
}

function handleFileDrop(e){ const f = e.dataTransfer.files[0]; if(f) processFile(f); }
function handleFileSelect(e){ const f = e.target.files[0]; if(f) processFile(f); }
async function processFile(file){
  const box = document.getElementById('uploadStatusBox');
  const name = file.name.toLowerCase();
  box.innerHTML = statusLine('Membaca CV...', true);
  try{
    let text = '';
    if(name.endsWith('.pdf')){
      const buf = await file.arrayBuffer();
      text = await extractTextFromPdf(buf);
    } else if(name.endsWith('.docx')){
      const buf = await file.arrayBuffer();
      text = await extractTextFromDocx(buf);
    } else if(name.endsWith('.txt')){
      text = await file.text();
    } else if(name.endsWith('.doc')){
      throw new Error('legacy_doc');
    } else {
      throw new Error('unsupported');
    }
    if(!text || text.trim().length<20) throw new Error('empty');
    uploadState.cvText = text; uploadState.fileName = file.name;
    document.getElementById('pasteArea').value = text.slice(0,4000) + (text.length>4000?'\n...(pratinjau dipotong, teks lengkap tetap tersimpan)':'');
    box.innerHTML = `<div class="flex items-center gap-2 text-mint-500 text-sm font-semibold">${icon('check','w-4 h-4')} ${esc(file.name)} berhasil dibaca</div>`;
  }catch(e){
    let msg = "CV ini tidak bisa dibaca. Silakan unggah file PDF, DOC, atau DOCX, atau tempel teks CV di bawah.";

async function startScreening(){
  const jobId = document.getElementById('uploadJobSelect').value;
  const pasted = document.getElementById('pasteArea').value.trim();
  const cvText = uploadState.cvText && uploadState.cvText.length>pasted.length ? uploadState.cvText : pasted;
  if(!cvText || cvText.length<20){ toast('Silakan unggah atau tempel CV terlebih dahulu.','error'); return; }
  const job = getJob(jobId);
  const box = document.getElementById('uploadStatusBox');
  const steps = ['Membaca CV...','Mengekstrak informasi kandidat...','Membandingkan dengan kebutuhan posisi...','Menyiapkan laporan screening...'];
  let stepIdx = 0;
  box.innerHTML = statusLine(steps[0], true);
  const stepTimer = setInterval(()=>{ stepIdx = Math.min(steps.length-1, stepIdx+1); box.innerHTML = statusLine(steps[stepIdx], true); }, 1400);
  document.querySelector('button[onclick="startScreening()"]').disabled = true;
  try{
    const cvData = await aiExtractCV(cvText);
    box.innerHTML = statusLine(steps[2], true);
    const screening = await aiScoreCandidate(cvData, job);
    clearInterval(stepTimer);
    box.innerHTML = statusLine(steps[3], true);

    let alternativeSuggestions = [];
    if(screening.overallScore < 70){
      try{ alternativeSuggestions = await aiSuggestAlternativeJobs(cvData, job, jobsArr()); }catch(e){}
    }

    const candidate = {
      id: uid('cand'), jobId, name: cvData.fullName || '', displayName: cvData.fullName || '',
      nameSource: cvData.fullName ? 'cv' : 'missing', nameConfidence: cvData.fullName ? (aiAvailable?'ai':'fallback') : 'none',
      email: cvData.email, phone: cvData.phone,
      location: cvData.location, cvText, cvData, cvStatus:'Analyzed',
      screening: { ...screening, alternativeSuggestions, recruiterNotes:'', status:'pending', source: aiAvailable?'ai':'fallback' },
      interview: { status:'not_started', questions:[], analysis:null, scheduledDate:null, scheduledTime:null, presenceRating:null },
      stage: 'AI Screening', notes:[], background:'', testCam:null, insight:null, appliedAt: Date.now(), lastActivityAt: Date.now(),
      timeline: [ {event:'CV Diunggah', date:Date.now()}, {event:'Screening AI Selesai', date:Date.now()} ]
    };
    await docSet('candidates', candidate.id, candidate);
    await addNotification(`${candidateDisplayName(candidate)} telah discreening untuk posisi ${job.name} — ${screening.overallScore}% cocok.`, '#/candidate/'+candidate.id+'/screening');
    toast('CV berhasil dianalisis.', 'success');
    nav('#/candidate/'+candidate.id+'/screening');
  }catch(e){
    clearInterval(stepTimer);
    console.error(e);
    box.innerHTML = `<div class="flex items-start gap-2 text-coral-600 text-sm font-semibold bg-coral-50 border border-coral-200 rounded-2xl p-3">${icon('alert','w-4 h-4 shrink-0 mt-0.5')} <span>Analisis AI gagal: ${esc(e.message||'error tidak diketahui')}. Silakan coba lagi.</span></div>`;
    document.querySelector('button[onclick="startScreening()"]').disabled = false;
  }
}

function buildCandidateInsight(c, job){
  const scores = [];
  if(c.screening) scores.push({label:'CV Assessment', score:c.screening.overallScore});
  if(c.testCam?.score!=null) scores.push({label:'Test Cam Assessment', score:c.testCam.score});
  if(c.interview?.analysis) scores.push({label:'Interview Assessment', score:c.interview.analysis.overallScore});
  const overallFit = scores.length ? Math.round(scores.reduce((sum,item)=>sum+item.score,0)/scores.length) : null;
  const missing = [];
  if(!c.screening) missing.push('CV screening belum selesai.');
  if(!c.testCam) missing.push('Test Cam belum selesai.');
  if(!c.interview?.analysis) missing.push('Interview belum selesai.');
  const strengths = [...(c.screening?.strengths||[]), ...(c.interview?.analysis?.strengths||[]), ...(c.testCam?.observedStrengths||[])];
  const concerns = [...(c.screening?.concerns||[]), ...(c.interview?.analysis?.concerns||[]), ...(c.testCam?.observedWeaknesses||[])];
  const followUp = [...(c.screening?.recommendedInterviewQuestions||[]), ...(c.interview?.analysis?.followUpQuestions||[]), ...(c.testCam?.recruiterFollowUp||[])];
  return { overallFit, scores, strengths:[...new Set(strengths)].slice(0,8), areasToVerify:[...new Set(missing.concat(c.screening?.missingInfo||[]))].slice(0,8), missingEvidence:missing, potentialConcerns:[...new Set(concerns)].slice(0,8), recruiterFollowUp:[...new Set(followUp)].slice(0,8), finalSummary:overallFit==null?'Insufficient evidence':'Ringkasan awal dari evidence yang tersimpan. Jalankan analisis AI untuk Candidate Insight lengkap.', aiStatus:'not_analyzed' };
}

"candidateOverview": string, "workHistoryPattern": {"relevantRoleCount": number|null,"relevantExperience": string[],"durationEvidence": string[],"careerProgression": string[],"employmentGaps": string[],"shortRolePatterns": string[],"workPatternEvidence": string[]},

Jangan isi field dengan tebakan. Jangan menyebut retention probability. Pastikan pertanyaan follow-up spesifik terhadap vacancy dan evidence kandidat.`;

async function rescreenForJob(cid, newJobId){
  const c = getCand(cid); const newJob = getJob(newJobId); if(!c || !newJob) return;
  toast('Menjalankan screening ulang untuk '+newJob.name+'...');
  const screening = await aiScoreCandidate(c.cvData, newJob);
  let alternativeSuggestions = [];
  if(screening.overallScore < 70){
    try{ alternativeSuggestions = await aiSuggestAlternativeJobs(c.cvData, newJob, jobsArr()); }catch(e){}
  }
  c.jobId = newJobId;
  c.screening = { ...screening, alternativeSuggestions, recruiterNotes:'', status:'pending', source: aiAvailable?'ai':'fallback' };
  c.timeline = c.timeline||[]; c.timeline.push({event:'Screening ulang untuk posisi '+newJob.name, date:Date.now()});
  await docSet('candidates', cid, c);
  toast('Screening ulang selesai.','success');
  render();
}
async function decideCandidate(id, action){
  const c = getCand(id);
  c.screening.recruiterNotes = document.getElementById('screeningNotes')?.value ?? c.screening.recruiterNotes;
  c.screening.status = 'reviewed';
  c.timeline = c.timeline||[];
  if(action==='interview'){ c.stage='Interview'; c.timeline.push({event:'Dipindahkan ke Interview', date:Date.now()}); }
  else if(action==='reject'){ c.stage='Rejected'; c.timeline.push({event:'Ditolak oleh recruiter', date:Date.now()}); }
  else { c.timeline.push({event:'Tetap di review', date:Date.now()}); }
  await docSet('candidates', id, c);
  toast(action==='interview'?'Dipindahkan ke tahap interview.':action==='reject'?'Kandidat ditolak.':'Catatan disimpan — tetap di review.','success');
  render();
}

    danceTest3: { scores:{creativity:0,musicality:0,confidence:0,expression:0,energy:0,stagePresence:0,improvisation:0}, notes:'' },
    workBoundariesAck: false, finalScore: null, recruiterDecision: null
  };

function avgScores(scoresObj){ const vals = Object.values(scoresObj||{}); return vals.length? vals.reduce((a,b)=>a+(Number(b)||0),0)/vals.length : 0; }
function computeTalentScore(t, job){
  const w = job.scorecardWeights || DEFAULT_TALENT_WEIGHTS;
  const camera = avgScores(t.cameraTest.scores)/5*100;
  const communication = (t.cameraTest.scores.communication||0)/5*100;
  const dance = avgScores(t.danceTest1.scores)/5*100;
  const learning = avgScores(t.danceTest2.scores)/5*100;
  const freestyle = avgScores(t.danceTest3.scores)/5*100;
  const presentation = (t.presentation.recruiterScore||0)/5*100;
  const entertainment = (t.presentation.entertainmentPotential||0)/5*100;
  const target = (t.presentation.workEthicScore||0)/5*100;
  const roleFit = (t.presentation.roleFitScore||0)/5*100;
  const total = (camera*w.camera + communication*w.communication + dance*w.dance + learning*w.learning + freestyle*w.freestyle + presentation*w.presentation + entertainment*w.entertainment + target*w.target + roleFit*w.roleFit) / 100;
  return { total: Math.round(total), breakdown: { camera:Math.round(camera), communication:Math.round(communication), dance:Math.round(dance), learning:Math.round(learning), freestyle:Math.round(freestyle), presentation:Math.round(presentation), entertainment:Math.round(entertainment), target:Math.round(target), roleFit:Math.round(roleFit) } };
}

function buildTestCamAssessment(t){
  const camera = avgScores(t.cameraTest?.scores)/5*100;
  const dance = avgScores(t.danceTest1?.scores)/5*100;
  const consistency = avgScores(t.danceTest2?.scores)/5*100;
  const score = Math.round((camera+dance+consistency)/3);
  const observedStrengths = [];
  const observedWeaknesses = [];
  if(camera >= 60) observedStrengths.push('Camera presence dan respons observasi berada pada level yang tercatat recruiter.');
  else observedWeaknesses.push('Camera presence belum menunjukkan bukti yang cukup dari skor observasi.');
  if(dance >= 60) observedStrengths.push('Eksekusi dance/rhythm memiliki skor observasi yang mendukung.');
  else observedWeaknesses.push('Eksekusi dance/rhythm perlu diverifikasi lebih lanjut.');
  return { score, observedStrengths, observedWeaknesses, specificEvidence:[t.cameraTest?.notes,t.danceTest1?.notes,t.danceTest2?.notes,t.danceTest3?.notes].filter(Boolean), recruiterFollowUp:['Verifikasi ulang faktor dengan skor rendah menggunakan rekaman atau observasi tambahan.'] };
}

      const prompt = `${AI_LANG_RULE}\nBerdasarkan catatan berikut tentang seorang kandidat talent (bukan CV formal), tulis 1-2 kalimat "kesan awal presentasi publik" yang OBSERVATIF dan netral (grooming/kesiapan tampil/gaya komunikasi) — JANGAN pernah menilai kecantikan, berat badan, atau menyimpulkan hal yang tidak disebutkan.\n\nCatatan: ${c.cvText||'(tidak ada catatan)'}\n\nBalas hanya kalimatnya, tanpa embel-embel.`;
      const res = await sampleApi(prompt, {modelTier:'quick', cache:false});
      note = res.text?.trim() || '';
    }catch(e){}
  }
  if(!note) note = 'Belum cukup informasi untuk kesan awal otomatis — silakan isi penilaian presentasi secara manual.';
  c.talent = c.talent || emptyTalentAssessment();
  c.talent.presentation.aiNotes = note;
  await docSet('candidates', cid, c);
  render();
}
async function saveTalentAssessment(cid){
  const c = getCand(cid); const job = getJob(c.jobId);
  const t = c.talent || emptyTalentAssessment();
  const iv = id => Number(val(id))||0;
  t.presentation = { ...t.presentation, recruiterScore:iv('p_recruiterScore'), entertainmentPotential:iv('p_entertainment'), workEthicScore:iv('p_workEthic'), roleFitScore:iv('p_roleFit'), recruiterNotes: val('p_notes') };
  t.cameraTest = { notes: val('ct_notes'), scores:{ cameraConfidence:iv('ct_cameraConfidence'), communication:iv('ct_communication'), facialExpression:iv('ct_facialExpression'), energy:iv('ct_energy'), naturalness:iv('ct_naturalness'), eyeContact:iv('ct_eyeContact'), voice:iv('ct_voice'), attention:iv('ct_attention'), improvisation:iv('ct_improvisation') } };
  t.danceTest1 = { danceChoice: val('dt1_choice'), notes: val('dt1_notes'), scores:{ confidence:iv('dt1_confidence'), rhythm:iv('dt1_rhythm'), bodyControl:iv('dt1_bodyControl'), expression:iv('dt1_expression'), energy:iv('dt1_energy') } };
  t.danceTest2 = { choreographyDifficulty: val('dt2_difficulty'), learningTimeSeconds: val('dt2_time')?Number(val('dt2_time')):null, attempts: val('dt2_attempts')?Number(val('dt2_attempts')):null, notes: val('dt2_notes'), scores:{ learningSpeed:iv('dt2_learningSpeed'), memory:iv('dt2_memory'), rhythm:iv('dt2_rhythm'), coordination:iv('dt2_coordination'), adaptability:iv('dt2_adaptability'), confidence:iv('dt2_confidence') } };
  t.danceTest3 = { notes: val('dt3_notes'), scores:{ creativity:iv('dt3_creativity'), musicality:iv('dt3_musicality'), confidence:iv('dt3_confidence'), expression:iv('dt3_expression'), energy:iv('dt3_energy'), stagePresence:iv('dt3_stagePresence'), improvisation:iv('dt3_improvisation') } };
  t.workBoundariesAck = document.getElementById('workBoundariesAck')?.checked || false;
  t.recruiterDecision = val('talentDecision') || null;
  t.finalScore = computeTalentScore(t, job).total;
  c.talent = t;
  c.testCam = buildTestCamAssessment(t);
  c.lastActivityAt = Date.now();
  c.timeline = c.timeline||[]; c.timeline.push({event:'Penilaian Live Talent diperbarui (skor: '+t.finalScore+')', date:Date.now()});

}

async function matchTalentWith(id, jobId){

  await docSet('talentLeads', id, t);

async function convertTalentToCandidate(id){
  const t = MEM.talentLeads[id]; if(!t) return;
  const results = t.campaignResults||{};
  const latestJobId = Object.keys(results).sort((a,b)=>(results[b].matchedAt||0)-(results[a].matchedAt||0))[0];
  const jobId = t.potentialPosition || latestJobId || jobsArr().find(j=>j.recruitmentType==='talent')?.id || jobsArr()[0]?.id;
  if(!jobId){ toast('Buat posisi rekrutmen dulu sebelum menambahkan ke kandidat.','error'); return; }
  const job = getJob(jobId);
  const latest = results[jobId];
  const candidate = {
    id: uid('cand'), jobId, name: t.name, email: null, phone: null, location: t.location,
    cvText: `Talent lead dari ${t.source}. Kategori: ${t.category}. Pengalaman: ${t.experience||'-'}. Catatan: ${t.notes||'-'}`,
    cvData: { fullName:t.name, email:null, phone:null, location:t.location, education:[], experience: t.experience?[{title:t.category,company:t.source,duration:'',description:t.experience}]:[], skills:t.skills||[], certifications:[], languages:[], totalYearsExperience:null },
    cvStatus:'Analyzed',
    screening: latest ? { overallScore:latest.overallScore, breakdown:{experience:latest.overallScore,skills:latest.overallScore,education:50,relevantBackground:latest.overallScore,jobRequirements:latest.overallScore}, whyMatches:latest.whyMatches, concerns:latest.needsVerification||[], missingInfo:[], recruiterNotes:'', status:'pending', source: aiAvailable?'ai':'fallback', alternativeSuggestions:[] } : null,
    interview: { status:'not_started', questions:[], analysis:null, scheduledDate:null, scheduledTime:null, presenceRating:null },

    stage: 'Talent Pool', notes:[{id:uid('note'), text:'Dipindahkan dari Talent Finder (sumber: '+t.source+').', createdAt:Date.now()}],
    appliedAt: Date.now(), timeline:[{event:'Dipindahkan dari Talent Finder', date:Date.now()}]

function viewFollowUp(){
  const STALE_DAYS = 3;
  const now = Date.now();
  const needsFollowUp = candArr().filter(c=>{
    if(['Hired','Rejected'].includes(c.stage)) return false;
    const lastEvent = (c.timeline||[]).reduce((max,e)=>Math.max(max,e.date||0), c.appliedAt);
    return (now - lastEvent) > STALE_DAYS*86400000;
  }).sort((a,b)=>{
    const la = (a.timeline||[]).reduce((max,e)=>Math.max(max,e.date||0), a.appliedAt);
    const lb = (b.timeline||[]).reduce((max,e)=>Math.max(max,e.date||0), b.appliedAt);
    return la-lb;
  });
  return `
  ${pageHeader('Follow Up Needed', `${needsFollowUp.length} kandidat belum ada aktivitas dalam ${STALE_DAYS}+ hari terakhir.`)}
  <div class="space-y-3">
    ${needsFollowUp.length ? needsFollowUp.map(c=>{
      const job = getJob(c.jobId);
      const name = candidateDisplayName(c);
      const lastEvent = (c.timeline||[]).reduce((max,e)=>Math.max(max,e.date||0), c.appliedAt);
      const days = Math.floor((now-lastEvent)/86400000);

let reportsPeriod = 'monthly';
function viewReports(){
  const now = Date.now();
  const windowMs = reportsPeriod==='daily'?86400000: reportsPeriod==='weekly'?7*86400000:30*86400000;
  const cands = candArr().filter(c=>now-c.appliedAt<=windowMs);
  const screened = cands.filter(c=>c.screening);
  const avgScore = screened.length ? Math.round(screened.reduce((a,c)=>a+c.screening.overallScore,0)/screened.length) : 0;
  const shortlisted = cands.filter(c=>['Interview','Assessment','HR Review','Offer','Hired'].includes(c.stage)).length;
  const interviews = cands.filter(c=>c.interview.status!=='not_started').length;
  const hired = cands.filter(c=>c.stage==='Hired').length;
  const rejected = cands.filter(c=>c.stage==='Rejected').length;
  const talentInWindow = talentArr().filter(t=>now-t.createdAt<=windowMs);
  const talentContacted = talentInWindow.filter(t=>t.contactStatus && t.contactStatus!=='Belum Dihubungi').length;
  const talentConverted = talentInWindow.filter(t=>['Proses','Diterima'].includes(t.recruitmentStatus)).length;
  const stats = [
    {label:'Kandidat Masuk', value:cands.length}, {label:'CV Discreening', value:screened.length}, {label:'Rata-rata Skor', value:avgScore+'%'},
    {label:'Shortlisted', value:shortlisted}, {label:'Interview', value:interviews}, {label:'Diterima', value:hired}, {label:'Ditolak', value:rejected},
    {label:'Talent Leads', value:talentInWindow.length}, {label:'Talent Dihubungi', value:talentContacted}, {label:'Talent Terkonversi', value:talentConverted},
  ];
  return `
  ${pageHeader('Laporan Rekrutmen', 'Metrik dihitung langsung dari data kandidat dan talent lead Anda.')}
  <div class="flex gap-2 mb-5">
    ${chip('Harian', reportsPeriod==='daily', `reportsPeriod='daily'; render()`)}
    ${chip('Mingguan', reportsPeriod==='weekly', `reportsPeriod='weekly'; render()`)}
    ${chip('Bulanan', reportsPeriod==='monthly', `reportsPeriod='monthly'; render()`)}
  </div>
  <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
    ${stats.map(s=>`<div class="card rounded-3xl p-4 text-center"><p class="font-display font-extrabold text-xl">${s.value}</p><p class="text-[11px] text-muted font-semibold mt-1">${s.label}</p></div>`).join('')}
  </div>`;
}

/* ================================= RENDER ================================= */
async function render(){
  const { page, id, sub, query } = currentRoute();
  const app = document.getElementById('app');
  let content = '';
  switch(page){
    case 'dashboard': content = viewDashboard(); break;
    case 'jobs':
      if(id==='new') content = viewJobForm(null);
      else if(id && sub==='edit') content = viewJobForm(id);
      else if(id) content = viewJobDetail(id);
      else content = viewJobs();
      break;
    case 'candidates': content = viewCandidates(query); break;
    case 'upload': content = viewUpload(id); break;
    case 'candidate':
      if(sub==='interview-setup') content = viewInterviewSetup(id);
      else content = viewCandidate(id, sub);
      break;
    case 'pipeline': content = viewPipeline(); break;
    case 'compare': content = viewCompare(); break;
    case 'templates': content = viewTemplates(); break;
    case 'talent': content = viewTalentFinder(query); break;
    case 'sourcing': content = viewSourcingGuide(); break;
    case 'followup': content = viewFollowUp(); break;
    case 'daily': content = viewDailyRecruitment(); break;
    case 'reports': content = viewReports(); break;
    case 'settings': content = viewSettings(); break;
    default: content = viewDashboard();
  }
  app.innerHTML = layout(page, content);
  window.scrollTo(0,0);
}

/* ================================== AUTH ==================================== */
const AUTH_KEY = 'screenly_auth_session';
function getSession(){
  try{ return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); }catch(e){ return null; }
}
function checkAuthAndProceed(){
  const session = getSession();
  if(session && MEM.account && session.username === MEM.account.username){
    CURRENT_USER.name = MEM.account.displayName; CURRENT_USER.role = MEM.account.role;
    if(!location.hash) location.hash = '#/dashboard';
    render();
  } else {
    renderLoginPage();
  }
}
function renderLoginPage(){
  document.getElementById('app').innerHTML = `
  <div class="min-h-screen flex items-center justify-center app-bg px-4">
    <div class="w-full max-w-sm">
      <div class="text-center mb-6">
        <div class="w-14 h-14 rounded-3xl bg-coral-500 mx-auto mb-3 flex items-center justify-center text-white font-display font-bold text-lg">SC</div>
        <h1 class="font-display text-2xl font-extrabold">Screenly</h1>
        <p class="text-muted text-sm mt-1">Masuk untuk mulai screening kandidat.</p>
      </div>
      <div class="card rounded-3xl p-6 shadow-lift">
        <label class="block mb-3"><span class="text-xs font-bold text-ink-600">Username</span>
          <input id="login_user" value="${esc(MEM.account?.username||'azhura')}" class="mt-1.5 w-full rounded-xl border border-app px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-coral-200"/></label>
        <label class="block mb-1"><span class="text-xs font-bold text-ink-600">Password</span>
          <input id="login_pass" type="password" placeholder="Masukkan password" onkeydown="if(event.key==='Enter') loginSubmit()" class="mt-1.5 w-full rounded-xl border border-app px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-coral-200"/></label>
        <div id="loginError" class="text-xs font-semibold text-coral-600 mt-2 hidden"></div>
        <button onclick="loginSubmit()" class="mt-5 w-full py-3 rounded-2xl bg-coral-500 hover:bg-coral-600 text-white font-bold text-sm shadow-soft">Masuk</button>
        <p class="text-[11px] text-muted mt-4 text-center">Akun ini khusus untuk ${esc(MEM.account?.displayName||'HR Azhura')}. Password bisa diganti nanti di Settings.</p>
      </div>
    </div>
  </div>`;
  document.getElementById('login_pass').focus();
}
function loginSubmit(){
  const u = (val('login_user')||'').trim().toLowerCase();
  const p = val('login_pass')||'';
  const acc = MEM.account;
  if(acc && u===acc.username.toLowerCase() && p===acc.password){
    localStorage.setItem(AUTH_KEY, JSON.stringify({ username: acc.username, at: Date.now() }));
    CURRENT_USER.name = acc.displayName; CURRENT_USER.role = acc.role;
    if(!location.hash) location.hash = '#/dashboard';
    render();
  } else {
    const err = document.getElementById('loginError');
    err.textContent = 'Username atau password salah.'; err.classList.remove('hidden');
  }
}
function logout(){
  localStorage.removeItem(AUTH_KEY);
  location.hash = '';
  renderLoginPage();
}

/* ================================= BOOT ==================================== */
(async function boot(){
  document.getElementById('app').innerHTML = `<div class="min-h-screen flex items-center justify-center app-bg">
    <div class="text-center"><div class="w-12 h-12 rounded-3xl bg-coral-500 mx-auto mb-3 flex items-center justify-center text-white font-display font-bold spin-slow">SC</div>
    <p class="text-sm text-muted font-semibold">Loading Screenly...</p></div></div>`;
  await initCapabilities();
  await seedIfNeeded();
  checkAuthAndProceed();
  // Register the service worker only when running as a standalone deployment
  // (window.claude absent) and served over http(s) — never inside the Claude
  // artifact iframe, and never on a plain file:// preview.
  if(typeof window.claude === 'undefined' && 'serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
